name: macOS disk image
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test and package for Apple Silicon
        run: |
          test "$(uname -m)" = arm64
          rustup update stable --no-self-update
          export RUSTUP_TOOLCHAIN=stable
          cargo test --locked
          bash installer/build-macos.sh
          hdiutil verify dist/*-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*-macos-arm64.dmg
          if-no-files-found: error
