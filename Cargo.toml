[package]
name = "dbml-studio"
version = "0.3.2"
edition = "2021"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = "0.15"
tempfile = "3"
serde_json = "1"
semver = "1"
sha2 = "0.10"
dbml-rs = "=1.0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"

[profile.dev]
debug = 0
